name: Build Community Images
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  # dev's merge queue: check each queued pull request on top of dev and the ones ahead of it.
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true
env:
  REPOSITORY: ghcr.io/life2launchlabs/launch-lms
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - run: bash -n scripts/ci/smoke-image.sh
  # On a push from a merged pull request, its run already built, smoke-tested and checked exactly this
  # code: skip the tests, and publish its image as this commit instead of building another.
  checked:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
      image_digest: ${{ steps.find.outputs.image_digest }}
      build_commit: ${{ steps.find.outputs.build_commit }}
    steps:
      - uses: actions/checkout@v6
      - id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/pr-checked.py find build-community.yaml | tee -a "$GITHUB_OUTPUT"
  api-tests:
    needs: checked
    if: needs.checked.outputs.run_id == ''
    uses: ./.github/workflows/api-tests.yaml
  api-lint:
    needs: checked
    if: needs.checked.outputs.run_id == ''
    uses: ./.github/workflows/api-lint.yaml
  migrations:
    needs: checked
    if: needs.checked.outputs.run_id == ''
    uses: ./.github/workflows/api-migrations.yaml
  browser-ui:
    needs: checked
    if: needs.checked.outputs.run_id == ''
    uses: ./.github/workflows/browser-ui.yaml
  # A pull request or merge queue run that passed everything: publish its tested image (branches of this
  # repository only; fork and Dependabot runs cannot write packages, so they only record the code they
  # checked) and record the code it checked, so the merge can deploy this exact image.
  checked-tree:
    name: Record checked code and image
    needs: [build, contract, api-tests, api-lint, migrations, browser-ui]
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        if: (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') || github.event_name == 'merge_group'
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
        if: (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') || github.event_name == 'merge_group'
      - uses: docker/login-action@v4
        if: (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') || github.event_name == 'merge_group'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the checked image (not a release; no branch tag)
        if: (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') || github.event_name == 'merge_group'
        run: |
          amd64=$(cat digests/amd64)
          arm64=$(cat digests/arm64)
          [[ "$amd64" =~ ^sha256:[a-f0-9]{64}$ && "$arm64" =~ ^sha256:[a-f0-9]{64}$ ]]
          tag="$REPOSITORY:checked-$(git rev-parse 'HEAD^{tree}')"
          docker buildx imagetools create -t "$tag" "$REPOSITORY@$amd64" "$REPOSITORY@$arm64"
          echo "IMAGE_DIGEST=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')" >> "$GITHUB_ENV"
      - run: python3 scripts/ci/pr-checked.py record checked.json && cat checked.json
      - uses: actions/upload-artifact@v7
        with:
          name: checked-tree
          path: checked.json
          retention-days: 30
  existing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - uses: actions/checkout@v6
      - id: find
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-community.yaml/runs?head_sha=$GITHUB_SHA&status=success&per_page=100" --jq '.workflow_runs | map(select((.event == "push" or .event == "workflow_dispatch") and (.head_branch == "main" or .head_branch == "dev"))) | first | .id // empty')
          if [ -n "$run_id" ]; then
            available=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq '[.artifacts[] | select(.name == "candidate" and .expired == false)] | length')
            if [ "$available" = 0 ]; then run_id=''; fi
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
  build:
    needs: [existing, checked]
    if: needs.existing.outputs.run_id == '' && needs.checked.outputs.image_digest == ''
    name: Build and smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build once and load locally
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.REPOSITORY }}:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          build-args: |
            LAUNCHLMS_VERSION=sha-${{ github.sha }}
            LAUNCHLMS_COMMIT_SHA=${{ github.sha }}
            LAUNCHLMS_IMAGE_REF=${{ env.REPOSITORY }}:sha-${{ github.sha }}
            LAUNCHLMS_RELEASED_AT=${{ github.event.head_commit.timestamp || github.run_id }}
            LAUNCHLMS_SOURCE_BRANCH=${{ github.head_ref || github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - uses: actions/cache@v4
        with:
          path: ~/ollama-models
          key: ollama-all-minilm-33m-${{ matrix.arch }}
      - name: Test the built image
        env:
          IMAGE: ${{ env.REPOSITORY }}:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
        run: OLLAMA_MODELS_DIR="$HOME/ollama-models" bash scripts/ci/smoke-image.sh
      - name: Let the cache read the embedding model
        run: sudo chown -R "$USER" "$HOME/ollama-models"
      - uses: docker/login-action@v4
        if: (github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') || github.event_name == 'merge_group'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image (no build)
        if: (github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') || github.event_name == 'merge_group'
        env:
          IMAGE: ${{ env.REPOSITORY }}:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
        run: |
          docker push "$IMAGE"
          mkdir -p digests
          docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}' > "digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        if: (github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') || github.event_name == 'merge_group'
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1
  candidate:
    name: Publish verified candidate
    needs: [existing, checked, build, contract, api-tests, api-lint, migrations, browser-ui]
    # Each test job passed here, or was skipped because its pull request passed it on the same code.
    if: >-
      always() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
      && needs.existing.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && needs.contract.result == 'success' && needs.checked.result == 'success'
      && (needs.api-tests.result == 'success' || (needs.api-tests.result == 'skipped' && needs.checked.outputs.run_id != ''))
      && (needs.api-lint.result == 'success' || (needs.api-lint.result == 'skipped' && needs.checked.outputs.run_id != ''))
      && (needs.migrations.result == 'success' || (needs.migrations.result == 'skipped' && needs.checked.outputs.run_id != ''))
      && (needs.browser-ui.result == 'success' || (needs.browser-ui.result == 'skipped' && needs.checked.outputs.run_id != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: actions/download-artifact@v8
        if: needs.existing.outputs.run_id == '' && needs.checked.outputs.image_digest == ''
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish checked manifest and evidence
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          EXISTING_RUN: ${{ needs.existing.outputs.run_id }}
          CHECKED_RUN: ${{ needs.checked.outputs.run_id }}
          CHECKED_DIGEST: ${{ needs.checked.outputs.image_digest }}
          CHECKED_COMMIT: ${{ needs.checked.outputs.build_commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$EXISTING_RUN" ]; then
            gh run download "$EXISTING_RUN" --name candidate --dir existing
            IMAGE_DIGEST=$(python3 scripts/ci/release-contract.py reuse existing/candidate.json)
            BUILD_COMMIT_SHA=$(python3 -c 'import json; print(json.load(open("existing/candidate.json")).get("build_commit_sha", ""))')
            docker buildx imagetools create -t "$REPOSITORY:$SOURCE_BRANCH" "$REPOSITORY@$IMAGE_DIGEST"
          elif [ -n "$CHECKED_DIGEST" ]; then
            # The pull request's run built, smoke-tested and checked this exact code into this image.
            [[ "$CHECKED_DIGEST" =~ ^sha256:[a-f0-9]{64}$ && "$CHECKED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
            echo "Publishing the image from pull request run $CHECKED_RUN (built from $CHECKED_COMMIT)."
            IMAGE_DIGEST="$CHECKED_DIGEST"
            BUILD_COMMIT_SHA="$CHECKED_COMMIT"
            docker buildx imagetools create -t "$REPOSITORY:sha-$GITHUB_SHA" -t "$REPOSITORY:$SOURCE_BRANCH" "$REPOSITORY@$IMAGE_DIGEST"
            test "$(docker buildx imagetools inspect "$REPOSITORY:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}')" = "$IMAGE_DIGEST"
          else
            amd64=$(cat digests/amd64)
            arm64=$(cat digests/arm64)
            [[ "$amd64" =~ ^sha256:[a-f0-9]{64}$ && "$arm64" =~ ^sha256:[a-f0-9]{64}$ ]]
            docker buildx imagetools create -t "$REPOSITORY:sha-$GITHUB_SHA" -t "$REPOSITORY:$SOURCE_BRANCH" "$REPOSITORY@$amd64" "$REPOSITORY@$arm64"
            IMAGE_DIGEST=$(docker buildx imagetools inspect "$REPOSITORY:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}')
          fi
          export IMAGE_DIGEST BUILD_COMMIT_SHA
          python3 scripts/ci/release-contract.py candidate candidate.json
      - uses: actions/upload-artifact@v7
        with:
          name: candidate
          path: candidate.json
          retention-days: 90
      - name: Request unstable deployment
        if: github.ref == 'refs/heads/dev' && vars.UNSTABLE_DEPLOY_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          python3 scripts/ci/release-contract.py dispatch candidate.json > dispatch.json
          gh api repos/Life2LaunchLabs/launch-lms-infra/dispatches --input dispatch.json
