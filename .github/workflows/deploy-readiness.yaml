# Image smoke checks now run in build-community.yaml against the built image.
# Kept as a manual entry point for investigating a published image; never rebuilds.
name: Deploy Readiness
on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Immutable image reference (repository@sha256:...)'
        required: true
      commit:
        description: 'Expected full source commit SHA'
        required: true
permissions:
  contents: read
  packages: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check image
        env:
          IMAGE: ${{ inputs.image }}
          GITHUB_SHA: ${{ inputs.commit }}
        run: |
          [[ "$IMAGE" =~ ^ghcr.io/life2launchlabs/launch-lms@sha256:[a-f0-9]{64}$ ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          bash scripts/ci/smoke-image.sh
