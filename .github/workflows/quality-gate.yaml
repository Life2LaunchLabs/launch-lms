name: Quality Gate

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # On a push from a merged pull request or the merge queue, these checks already passed on exactly this code: skip them.
  checked:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - uses: actions/checkout@v6
      - id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/pr-checked.py find quality-gate.yaml | tee -a "$GITHUB_OUTPUT"

  analyze:
    needs: checked
    if: needs.checked.outputs.run_id == ''
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.plan.outputs.api }}
      web: ${{ steps.plan.outputs.web }}
      browser: ${{ steps.plan.outputs.browser }}
      full: ${{ steps.plan.outputs.full }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
      files: ${{ steps.plan.outputs.files }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: plan
        name: Classify changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: python3 scripts/quality-plan.py "$BASE_SHA" HEAD --github-output "$GITHUB_OUTPUT"

  contracts:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate repository-owned truth
        run: ./scripts/agent docs
      - name: Validate release contracts
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v

  web:
    needs: analyze
    if: needs.analyze.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install web dependencies
        run: bun install --frozen-lockfile
        working-directory: apps/web
      - name: Lint, type check, and unit test web
        run: bun run lint && bun run typecheck && bun run test:unit
        working-directory: apps/web

  # API lint and tests and the browser smoke run in Build Community Images (required checks) on the
  # same code; running them here too only doubled the runner time per pull request and queue entry.

  quality-gate:
    name: quality-gate
    if: always()
    needs: [checked, analyze, contracts, web]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check
        env:
          CHECKED: ${{ needs.checked.result }}
          CHECKED_RUN: ${{ needs.checked.outputs.run_id }}
          ANALYZE: ${{ needs.analyze.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          WEB: ${{ needs.web.result }}
        run: |
          test "$CHECKED" = success
          if [ -n "$CHECKED_RUN" ]; then
            printf 'quality-gate passed in pull request run %s on this exact code\n' "$CHECKED_RUN"
            exit 0
          fi
          test "$ANALYZE" = success
          for result in "$CONTRACTS" "$WEB"; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
          printf 'quality-gate passed (web=%s)\n' "$WEB"
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
      - name: Record checked code
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: python3 scripts/ci/pr-checked.py record checked.json && cat checked.json
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          name: checked-tree
          path: checked.json
          retention-days: 30
