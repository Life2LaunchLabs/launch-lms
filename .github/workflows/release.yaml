name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  actions: read
  packages: write
concurrency:
  group: production-release
  cancel-in-progress: false
env:
  REPOSITORY: ghcr.io/life2launchlabs/launch-lms
  INFRA_REPO: Life2LaunchLabs/launch-lms-infra
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Find successful build for the tagged main commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-community.yaml/runs?head_sha=$GITHUB_SHA&branch=main&status=success&per_page=100" --jq '.workflow_runs | map(select(.event == "push" or .event == "workflow_dispatch")) | first | .id // empty')
          test -n "$run_id" || { echo 'Wait for the main candidate build to pass, then rerun this release.'; exit 1; }
          gh run download "$run_id" --name candidate --dir evidence
          python3 scripts/ci/release-contract.py promote evidence/candidate.json release.lock.json
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the checked digest without rebuilding
        run: |
          digest=$(python3 -c 'import json; print(json.load(open("release.lock.json"))["image_digest"])')
          # Re-runs may reuse the same version; a version must never change images.
          if existing=$(docker buildx imagetools inspect "$REPOSITORY:$GITHUB_REF_NAME" --format '{{.Manifest.Digest}}' 2>/dev/null); then
            test "$existing" = "$digest" || { echo 'Version already points to another image'; exit 1; }
          fi
          docker buildx imagetools create -t "$REPOSITORY:$GITHUB_REF_NAME" -t "$REPOSITORY:${GITHUB_REF_NAME#v}" "$REPOSITORY@$digest"
          test "$(docker buildx imagetools inspect "$REPOSITORY:$GITHUB_REF_NAME" --format '{{.Manifest.Digest}}')" = "$digest"
      - name: Record release evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --latest=false
          fi
          gh release upload "$GITHUB_REF_NAME" release.lock.json --clobber
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra
      - name: Update production lock
        run: cp release.lock.json infra/release.lock.json
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra
          branch: release/pin-${{ github.ref_name }}
          commit-message: 'chore: pin Launch LMS ${{ github.ref_name }}'
          title: 'chore: deploy Launch LMS ${{ github.ref_name }}'
          body: |
            Promote the verified main candidate without rebuilding it.
            Review release.lock.json for the source commit, build run, and exact image digest.
            Merging this PR deploys production. Review migration/backup requirements first.
